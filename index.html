<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QCM Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📝 QCM Builder</h1>
      <p>Créez vos QCM facilement</p>
    </div>
  </header>

  <main>
    <!-- Panneau gauche : formulaire -->
    <section class="panel panel-form">
      <div class="section-title">Nouveau QCM</div>

      <div class="form-group">
        <label for="qcm-title">Titre du QCM</label>
        <input type="text" id="qcm-title" placeholder="Ex : Mathématiques - Chapitre 3" />
      </div>

      <div class="form-group">
        <label for="qcm-desc">Description (optionnel)</label>
        <textarea id="qcm-desc" rows="2" placeholder="Consignes, contexte..."></textarea>
      </div>

      <hr />

      <div class="section-title">Ajouter une question</div>

      <div class="form-group">
        <label for="q-text">Intitulé de la question</label>
        <input type="text" id="q-text" placeholder="Ex : Quelle est la capitale de la France ?" />
      </div>

      <div id="choices-container">
        <label>Choix de réponses <span class="hint">(cochez la bonne réponse)</span></label>
        <div class="choice-row" data-index="0">
          <input type="radio" name="correct" value="0" title="Bonne réponse" />
          <input type="text" class="choice-input" placeholder="Choix A" />
          <button class="btn-remove-choice" title="Supprimer">✕</button>
        </div>
        <div class="choice-row" data-index="1">
          <input type="radio" name="correct" value="1" title="Bonne réponse" />
          <input type="text" class="choice-input" placeholder="Choix B" />
          <button class="btn-remove-choice" title="Supprimer">✕</button>
        </div>
      </div>

      <button class="btn btn-secondary" id="btn-add-choice">+ Ajouter un choix</button>

      <div class="form-group" style="margin-top:1rem;">
        <label for="q-explication">Explication (optionnel)</label>
        <textarea id="q-explication" rows="2" placeholder="Pourquoi cette réponse ?"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="btn-add-question">Ajouter la question</button>
      </div>
    </section>

    <!-- Panneau droit : aperçu -->
    <section class="panel panel-preview">
      <div class="section-title">
        Aperçu du QCM
        <span id="question-count" class="badge">0 question(s)</span>
      </div>

      <div id="preview-header" class="preview-header hidden">
        <h2 id="preview-title"></h2>
        <p id="preview-desc"></p>
      </div>

      <div id="questions-list">
        <div class="empty-state">Aucune question pour l'instant.<br/>Remplissez le formulaire à gauche.</div>
      </div>

      <div class="preview-actions">
        <button class="btn btn-danger" id="btn-clear" title="Tout effacer">🗑 Effacer tout</button>
        <button class="btn btn-export" id="btn-export-json" title="Exporter JSON">⬇ JSON</button>
        <button class="btn btn-export" id="btn-export-pdf" title="Imprimer / PDF">🖨 PDF</button>
      </div>
    </section>
  </main>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Modal confirmation -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <p id="modal-message">Êtes-vous sûr ?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Annuler</button>
        <button class="btn btn-danger" id="modal-confirm">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
